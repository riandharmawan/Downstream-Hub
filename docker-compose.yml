# Downstream Hub — Docker Compose (Dev / environment parity)
# Run: docker compose up --build
# Frontend (host port): FRONTEND_PORT from .env — default 3100 to avoid clashing with Jetty/other apps on 3000. Backend API: http://localhost:4000

services:
  postgres:
    image: postgres:16-alpine
    container_name: downstream-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubsecret}
      POSTGRES_DB: ${POSTGRES_DB:-downstream_hub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-downstream_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: downstream-hub-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: downstream-hub-api
    restart: unless-stopped
    # Root .env is loaded first; Backend/.env overrides (SMTP, PUBLIC_APP_URL, etc.).
    # Docker did not use Backend/.env before — only repo-root .env — so edit root .env or Backend/.env and recreate the container.
    env_file:
      - .env
      - Backend/.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hubsecret}@postgres:5432/${POSTGRES_DB:-downstream_hub}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      # Persist uploaded app icons across container rebuilds
      - ./Backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:4000}
    container_name: downstream-hub-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
