# Nginx — Frontend + API proxy (172.28.92.56)
# Use this so the browser only talks to this server; Nginx forwards /api to the backend (172.28.92.57:4000).
# Listen on 3010 (public) while frontend container listens on 3100. Users open http://172.28.92.56:3010

server {
    listen 3010;
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Frontend SPA (Docker container on 3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — forward to backend (172.28.92.57); security group allows 172.28.92.56 -> 4000
    location /api/ {
        proxy_pass http://172.28.92.57:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded app icons (stored on backend)
    location /uploads/ {
        proxy_pass http://172.28.92.57:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
