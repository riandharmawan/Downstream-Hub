# Nginx — Frontend + API proxy (172.28.92.56)
# Use this so the browser only talks to this server; Nginx forwards /api to the backend (172.28.92.57:4000).
# Listen on 3011 so the frontend container can stay on 3010. Users open http://172.28.92.56:3011

server {
    listen 3011;
    server_name _;

    # Frontend SPA (Docker container on 3010)
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — forward to backend (172.28.92.57); security group allows 172.28.92.56 -> 4000
    location /api/ {
        proxy_pass http://172.28.92.57:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
