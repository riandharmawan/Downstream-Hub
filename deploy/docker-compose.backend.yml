# Downstream Hub — Backend API only (run on 172.28.92.57)
# Usage: from repo root: cp deploy/env.backend.example Backend/.env && edit Backend/.env
#        docker compose -f deploy/docker-compose.backend.yml up -d
# API: http://172.28.92.57:4000
# DATABASE_URL in Backend/.env must point at the DB host (172.28.92.60:5432).

services:
  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: downstream-hub-api
    restart: unless-stopped
    env_file:
      - ../Backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ../Backend/uploads:/app/uploads
