# Downstream Hub — Backend + PostgreSQL (run on 172.28.92.57)
# Usage: from repo root: cp deploy/env.backend.example Backend/.env && edit Backend/.env
#        docker compose -f deploy/docker-compose.backend.yml up -d
# API: http://172.28.92.57:4000

services:
  postgres:
    image: postgres:16-alpine
    container_name: downstream-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hubsecret}
      POSTGRES_DB: ${POSTGRES_DB:-downstream_hub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-downstream_hub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: downstream-hub-api
    restart: unless-stopped
    env_file:
      - ../Backend/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-hubsecret}@postgres:5432/${POSTGRES_DB:-downstream_hub}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
