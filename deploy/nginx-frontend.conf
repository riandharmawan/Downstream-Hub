# Nginx — Downstream Hub Frontend (172.28.92.56)
# Listen on port 3010 (3000/3001/80 already in use).
# Place in /etc/nginx/conf.d/downstream-hub.conf or include from nginx.conf

server {
    listen 3010;
    server_name _;
    root /opt/downstream-hub/Frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy /api to backend (if you want same-origin; else frontend calls 172.28.92.57:4000 directly)
    # location /api/ {
    #     proxy_pass http://172.28.92.57:4000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
