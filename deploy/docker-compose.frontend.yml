# Downstream Hub — Frontend only (run on 172.28.92.56)
# Usage: from repo root: docker compose -f deploy/docker-compose.frontend.yml up -d
# Frontend: http://172.28.92.56:3010

services:
  frontend:
    build:
      context: ..
      dockerfile: Frontend/Dockerfile
      args:
        VITE_API_URL: http://172.28.92.57:4000
    container_name: downstream-hub-web
    restart: unless-stopped
    ports:
      - "3010:3000"
