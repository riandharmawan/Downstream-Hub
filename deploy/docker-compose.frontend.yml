# Downstream Hub — Frontend only (run on 172.28.92.56)
# Usage: from repo root: docker compose -f deploy/docker-compose.frontend.yml up -d
# Frontend container host binding: 3100 (Nginx serves public 3010)

services:
  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://172.28.92.56:3010
    container_name: downstream-hub-web
    restart: unless-stopped
    ports:
      - "3100:3000"
